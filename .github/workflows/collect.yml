# 공모 자동 수집 — 매일 05:30(KST) 주요 기관 공고를 읽어 data/calls.json 을 갱신하고 커밋한다.
# 커밋이 생기면 Vercel 이 자동으로 다시 배포한다. (schedule 은 기본 브랜치에서만 돈다)
name: collect-calls
on:
  schedule:
    - cron: '30 20 * * *'   # UTC 20:30 = KST 05:30
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run collect
      - name: commit data
        run: |
          git config user.name "kcap-bot"
          git config user.email "kcapp@naver.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 공모 자동 수집 $(date -u +%Y-%m-%d)"
          git push
